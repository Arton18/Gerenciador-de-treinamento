<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desempenho do Aluno</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
    margin:0;
    padding:30px;
    font-family:Arial, Helvetica, sans-serif;
    background:#f4f6f8;
}

h1{
    text-align:center;
    margin-bottom:30px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:40px;
}

.card{
    background:white;
    border-radius:10px;
    padding:20px;
    text-align:center;
    box-shadow:0 3px 10px rgba(0,0,0,.15);
}

.card h2{
    margin:0;
    color:#666;
}

.card p{
    font-size:32px;
    margin-top:15px;
    font-weight:bold;
}

.graficos{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:30px;
}

.grafico{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 3px 10px rgba(0,0,0,.15);
}

@media(max-width:900px){
.graficos{
    grid-template-columns:1fr;
}
}
.voltar{
    display: block;
    width: 350px;
    margin: 40px auto 0;
    padding: 18px;
    font-size: 22px;
    font-weight: bold;
    background: #28a745;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.3s;
}

.voltar:hover{
    background: #218838;
}
</style>

</head>
<body>

<h1>Desempenho do Aluno</h1>

<div class="cards">

<div class="card">
<h2>Treinos Concluídos</h2>
<p id="totalTreinos">0</p>
</div>

<div class="card">
<h2>Calorias</h2>
<p id="totalCalorias">0 kcal</p>
</div>

<div class="card">
<h2>Tempo Total</h2>
<p id="tempoTotal">0 min</p>
</div>

</div>

<div class="graficos">

<div class="grafico">
<h2>Treinos por mês</h2>
<canvas id="graficoTreinos"></canvas>
</div>

<div class="grafico">
<h2>Calorias por mês</h2>
<canvas id="graficoCalorias"></canvas>
</div>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const alunoId = params.get("aluno");

async function carregarGraficos(){

    const respostaTreinos = await fetch(`/api/informacao/aluno/${alunoId}/mes`);
    const dadosTreinos = await respostaTreinos.json();

    const respostaCalorias = await fetch(`/api/informacao/aluno/${alunoId}/caloria`);
    const dadosCalorias = await respostaCalorias.json();

    document.getElementById("totalTreinos").textContent =
        dadosTreinos.reduce((soma,item)=>soma+Number(item.quantidade),0);

    document.getElementById("totalCalorias").textContent =
        dadosCalorias.reduce((soma,item)=>soma+Number(item.calorias),0)+" kcal";

    new Chart(document.getElementById("graficoTreinos"),{
        type:"bar",
        data:{
            labels:dadosTreinos.map(x=>x.mes),
            datasets:[{
                label:"Treinos",
                data:dadosTreinos.map(x=>x.quantidade),
                borderWidth:1
            }]
        }
    });

    new Chart(document.getElementById("graficoCalorias"),{
        type:"line",
        data:{
            labels:dadosCalorias.map(x=>x.mes),
            datasets:[{
                label:"Calorias",
                data:dadosCalorias.map(x=>x.calorias),
                fill:false,
                tension:0.3
            }]
        }
    });

}

async function carregarTempo(){

    const resposta = await fetch(`/api/informacao/aluno/${alunoId}/tempo`);
    const dados = await resposta.json();

    const total = dados.reduce((soma,item)=>soma+Number(item.minutos),0);

    document.getElementById("tempoTotal").textContent = total+" min";

}

if(alunoId){
    carregarGraficos();
    carregarTempo();
}else{
    alert("Aluno não informado.");
}
function irParaPGTreinador(){

    window.location.href = "treinopaginaTreinador.html";
}

</script>
<button onclick="irParaPGTreinador()" class="voltar">
    Voltar ao Início
</button>
</body>
</html>
