<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>


form {
     padding: 10 px;
    width: min(90vw, 300px);
    border-radius: 40px;
    box-sizing: border-box;
}
@media (max-width: 600px) {

    form {
        width: 95vw;
        padding: 10px 25px;
    }

    input {
        height: 50px;
        font-size: 18px;
    }

    button {
        min-height: 50px;
        font-size: 18px;
    }
}
body {
     margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial;
    background: #DED4C3;
    padding: 20px;
    box-sizing: border-box;

}
button {
    background: #007bff;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 18px;
    cursor: pointer;
width: min(100%, 300px);
}
input {
    width: 100%;
    height: 45px;

    padding: 10px;

    font-size: 16px;

    border: 1px solid #aaa;
    border-radius: 6px;

    box-sizing: border-box;
}


div {
    margin-bottom: 10px;
}

label {
    display: block;
    margin-bottom: 5px;
}
</style>

</head>
<body>
<form id="login">
  <div>
    <label for="email">Email: </label>
    <input type="email" id="email">
  </div>
  <div>
    <label for="senha">Senha:</label>
    <input type="password" id="senha" required>
  
<div>
  <p id=erroSenha style="color:red;"></p>

    <button type="submit" style="font-size: 18px;padding: 10px 20px;margin-top:15px" >Login</button>
</div>
<button
    type="button"
    onclick="window.location.href='/inicial.html'"
    style="font-size: 18px; padding: 10px 20px; margin-top: 15px;">
    Página Inicial
</button>
</form>
<script src="logincadastroback.js"></script>
</body>
</html>
