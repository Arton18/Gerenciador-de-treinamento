<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Área do Treinador</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f4f4f4;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    text-align:center;
}

h1{
    margin-bottom:40px;
}

.botoes{
    display:flex;
    flex-direction:column;
    gap:20px;
}

button{
    width:250px;
    padding:15px;
    font-size:18px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:#007bff;
    color:white;
}

button:hover{
    background:#0056b3;
}

</style>

</head>

<body>

<div class="container">

    <h1>Área do Treinador</h1>

    <div class="botoes">

        <button onclick="window.location.href='meusTreinos.html'">
            Treinos
        </button>

        <button onclick="window.location.href='graficoTreinador.html'">
            Alunos
        </button>

    </div>

</div>

</body>
</html>
